<h3>작품 소개</h3>
<p>천재 시인 백석의 삶의 여정을 추적하며, 삶이 예술이 되는 순간과 예술이 삶이 되는 순간의 접합점을 찾는다. 우리는 백석이 남긴 시가 아니라 백석이 남긴 삶을 기억하게 될 것이다. 그린피그 '예술가 연작' 첫 번째 작품.</p>
